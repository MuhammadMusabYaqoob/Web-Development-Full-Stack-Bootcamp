
<!DOCTYPE html>
<!--
    DOCTYPE tells the browser that this document
    uses modern HTML5.
    It is a declaration, NOT an HTML element.
-->

<html lang="en">
<!--
    The html element is the ROOT of the document.
    All HTML elements go inside it.

    lang="en" is an ATTRIBUTE.
    It tells the browser that the main language
    of this webpage is English.
-->

<head>
    <!--
        The head element contains information ABOUT
        the webpage, rather than its visible content.

        Examples: title, metadata, CSS links, etc.
    -->

    <meta charset="UTF-8">
    <!--
        meta is a VOID ELEMENT.
        Void elements cannot contain child elements
        and therefore do not need closing tags.

        charset is an ATTRIBUTE.
        UTF-8 specifies the character encoding.
        It supports English, Urdu, Arabic, emojis, etc.
    -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
        Another meta element.

        name="viewport":
        Identifies the viewport settings.

        content="width=device-width":
        Makes the webpage viewport match the device width.

        initial-scale=1.0:
        Sets the initial zoom level to 100%.

        This helps websites work properly on mobile devices.
    -->

    <title>My First Website</title>
    <!--
        The title element defines the webpage title.

        It usually appears in the browser tab.
        Unlike meta, title is NOT a void element.
        It has opening and closing tags.
    -->

</head>
<!--
    Closing head tag.
    Everything related to the head section goes above this.
-->

<body>
    <!--
        The body contains the actual webpage content.

        Text, images, buttons, headings, links, etc.
        generally go inside the body.
    -->

    <h1>Hello World!</h1>
    <!--
        h1 means Heading 1.
        It represents the main heading of the page.
    -->

    <p>This is my first webpage.</p>
    <!--
        p means Paragraph.
        It is used to display a paragraph of text.
    -->

</body>
<!--
    Closing body tag.
    The visible webpage content ends here.
-->

</html>
<!--
    Closing html tag.
    This marks the end of the HTML document.
-->
