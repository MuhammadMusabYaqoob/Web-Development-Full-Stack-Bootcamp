<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For of loop</title>
</head>
<body>
    <script>
        // for of loop
        // Used for iterables (Arrays, Strings, Maps, Sets
        // for in vs for of
        // for in return index while for of return values
        const arr1 = ["Ahmad", "Ali", "Musab"]
        for(let value of arr1){
            console.log(value)
        }
    </script>
</body>
</html>
