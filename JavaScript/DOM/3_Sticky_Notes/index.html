<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Isometra&family=Kings&family=Lato:wght@100;300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link href="src/output.css" rel="stylesheet">
  <title>Sticky Notes</title>
</head>
<body>
  <header class="heading w-full">
    <h1 class="text-3xl font-bold text-center mt-32">Sticky Notes</h1>
  </header>
  
  <button class="add-note-btn">Add Note</button>
  <div class="notes-container w-full"></div>
  <div class="delete-modal">
  <div class="modal-box">
    <h2>Are you sure to delete?</h2>

    <div class="modal-buttons">
      <button class="yes-btn">Yes</button>
      <button class="no-btn">No</button>
    </div>
  </div>
</div>


  <script src="index.js"></script>
</body>
</html>
