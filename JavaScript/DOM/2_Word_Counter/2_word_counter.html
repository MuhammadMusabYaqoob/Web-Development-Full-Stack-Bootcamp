<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto+Serif:ital,opsz,wdth,wght@0,8..144,75,100..900;1,8..144,75,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>WORD COUNTER</title>
</head>
<body>
    <div class="container">
        <div class="text-area-container">
            <textarea name="" id="textArea" rows="10" cols="50" placeholder="Start typing or paste your text here..."></textarea>
        </div>
        <div class="counters-container">
            <h2>CHARACTERS: <span id="charCount">0</span></h2>
            <h2>SPACES: <span id="spaceCount">0</span></h2>
            <h2 class="words">WORDS LIMIT: <span id="wordCount" class="words">0/1000</span></h2>
        </div>
        <button id="copy-btn">COPY TEXT</button>
    </div>
    <div class="alert-box">
        <div class="message-box">
            <p class="message">Copied to clipboard</p>
        </div>
        <!-- <div class="btn-box">
            <button id="okBtn">OK</button>
        </div> -->
    </div>
    <script src="index.js"></script>
</body>
</html>
