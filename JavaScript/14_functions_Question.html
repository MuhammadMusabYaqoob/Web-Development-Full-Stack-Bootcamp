    <script>
        // Question 1: Find the Larger Number
        console.log("========MAX NUMBER========")
        console.log(max(10, 20))
        function max(a, b){
            if(typeof a === "number" && typeof b === "number"){
                if(a > b){
                    return a + ' is greather then ' + b
                }else if (a < b){
                    return b + ' is greather then ' + a
                }else return "Both numbers are equal"
            }else{
                return "Please enter a valid number"
            }
        }
        console.log("========TERNARY OPERATOR========")
        function max_with_ternary_operator(a, b){
            if(typeof a === "number" && typeof b === "number"){
                return a > b
                ? a + ' is greater than ' + b
                : a === b
                    ? 'Both numbers are equal'
                    : b + ' is greater than ' + a;

            }else{
                return "Please enter a valid number"
            }
        }
        console.log(max_with_ternary_operator(10, 20))




        // Question 2: Check if a number is even or odd
        console.log("========EVEN NUMBER========")
        function isEven(num){
            if(typeof num === "number"){
                if(num % 2 === 0){
                    return num + " is even"
                }else{
                    return num + " is odd"
                }
            }else{
                return "Please enter a valid number"
            }
        }
        console.log(isEven(10))
        console.log("========TERNARY OPERATOR========")
        const isEven_with_ternary_operator = (number) => {
            return typeof number === 'number' 
                ? 
             number % 2 === 0 ? number + " is even" : number + " is odd"
            : 
            "Please enter a valid number"
        }
        console.log(isEven_with_ternary_operator(10))



        // Question 3: Create a function that reverses a string.
        console.log("========REVERSE STRING========")
        function reverseString(str) {
            if (typeof str !== "string" || str.length === 0) {
                return "Please enter a valid string";
            }
            let reversed = '';
            for (let i = str.length - 1; i >= 0; i--) {
                reversed = reversed + str[i];
            }
            return reversed;
        }
        console.log(reverseString(""))


        // Question 4: Find the number of vowels in a string.
        console.log("========REVERSE STRING========")
        function countVowels(str) {
            str = str.toLowerCase();
            if(typeof str !== "string" || str.length === 0){
                return "Please enter a valid string"
            }
            let count = 0
            for(let i = 0; i < str.length; i++){
                if(str[i] === "a" || str[i] === "e" || str[i] === "i" || str[i] === "o" || str[i] === "u"){
                // if ("aeiou".includes(str[i])){
                    count++;
                }
            }
            return count;
        }
        let str = "HELLO";
        console.log("In " + str + " have " + countVowels(str) + " vowels")





        // Question 5: Find the frequency of each character.
        console.log("========COUNT EACH CHARACTER========")
        function countEachCharacter(mystr1) {
            if (typeof mystr1 !== "string" || mystr1.length === 0) {
                return "Please enter a valid string";
            }
            let count = {};
            for (let i = 0; i < mystr1.length; i++) {
                if (count[mystr1[i]] !== undefined) {
                    count[mystr1[i]]++;
                } else {
                    count[mystr1[i]] = 1;
                }
            }
            return count;
        }
        let str2 = "HELLO";
        console.log(countEachCharacter(str2));






                // Question 5: Find the most frequence character.
        console.log("========MOST FREQUENCE CHARACTER========")
            function countMostFrequenceCharacter(str) {
            if (typeof str !== "string" || str.length === 0) {
                return "Please enter a valid string";
            }
            let count = {};
            for (let i = 0; i < str.length; i++) {
                if (count[str[i]] !== undefined) {
                    count[str[i]]++;
                } else {
                    count[str[i]] = 1;
                }
            }
            let maxCount = 0;
            let maxChar = "";
            for (let char in count) {
                if (count[char] > maxCount) {
                    maxCount = count[char];
                    maxChar = char;
                }
            }
            return maxChar;
        }
        let str3 = "HELLO";
        console.log(countMostFrequenceCharacter(str3));

        }

            return "Hello, World!";
        }
        console.log(callbackFunction(greet));
