<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
</body>
<script>
    // ====================================================
    // JAVASCRIPT ARRAYS - COMPLETE NOTES
    // ====================================================

    // Array = Collection of multiple values

    let fruits = ["Apple", "Mango", "Banana"];

    console.log(fruits);


    // ====================================================
    // ACCESSING VALUES
    // ====================================================

    let colors = ["Red", "Green", "Blue"];

    // Index starts from 0

    console.log(colors[0]); // Red
    console.log(colors[1]); // Green
    console.log(colors[2]); // Blue

    // Last element

    console.log(colors[colors.length - 1]); // Blue


    // ====================================================
    // ARRAY LENGTH
    // ====================================================

    let students = ["Ali", "Ahmad", "Musab"];

    console.log(students.length); // 3


    // ====================================================
    // CREATE ARRAYS
    // ====================================================

    // Method 1 (Most Common)

    let arr1 = [1,2,3];

    // Method 2

    let arr2 = new Array(1,2,3);

    // Method 3

    let arr3 = new Array(5);

    console.log(arr3.length); // 5


    // ====================================================
    // CRUD OPERATIONS
    // ====================================================

    // CREATE

    let cars = ["Honda", "Toyota"];

    // READ

    console.log(cars[0]); // Honda

    // UPDATE

    cars[1] = "Suzuki";

    console.log(cars);

    // DELETE

    cars.splice(1,1);

    console.log(cars);


    // ====================================================
    // PUSH()
    // ADD ELEMENT AT END
    // ====================================================

    let numbers = [1,2,3];

    numbers.push(4);

    console.log(numbers);

    // [1,2,3,4]


    // ====================================================
    // POP()
    // REMOVE ELEMENT FROM END
    // ====================================================

    let nums = [1,2,3,4];

    nums.pop();

    console.log(nums);

    // [1,2,3]


    // ====================================================
    // UNSHIFT()
    // ADD ELEMENT AT START
    // ====================================================

    let data = [2,3,4];

    data.unshift(1);

    console.log(data);

    // [1,2,3,4]


    // ====================================================
    // SHIFT()
    // REMOVE ELEMENT FROM START
    // ====================================================

    let values = [1,2,3];

    values.shift();

    console.log(values);

    // [2,3]


    // ====================================================
    // CONCAT()
    // JOIN ARRAYS
    // ====================================================

    let a = [1,2];
    let b = [3,4];

    let result = a.concat(b);

    console.log(result);

    // [1,2,3,4]


    // ====================================================
    // JOIN()
    // CONVERT ARRAY TO STRING
    // ====================================================

    let letters = ["A","B","C"];

    console.log(letters.join("-"));

    // A-B-C


    // ====================================================
    // INCLUDES()
    // CHECK VALUE EXISTS
    // ====================================================

    let marks = [10,20,30];

    console.log(marks.includes(20));

    // true


    // ====================================================
    // INDEXOF()
    // FIND POSITION
    // ====================================================

    let names = ["Ali","Ahmad","Musab"];

    console.log(names.indexOf("Musab"));

    // 2


    // ====================================================
    // REVERSE()
    // REVERSE ARRAY
    // ====================================================

    let arr = [1,2,3];

    arr.reverse();

    console.log(arr);

    // [3,2,1]


    // ====================================================
    // SORT()
    // SORT ARRAY
    // ====================================================

    let sortArray = [100,20,3];

    // WRONG FOR NUMBERS

    sortArray.sort();

    console.log(sortArray);

    // [100,20,3]

    // Because JS converts values into strings


    // CORRECT NUMERIC SORT

    sortArray.sort((a,b)=>a-b);

    console.log(sortArray);

    // [3,20,100]


    // DESCENDING

    sortArray.sort((a,b)=>b-a);

    console.log(sortArray);

    // [100,20,3]


    // ====================================================
    // SLICE()
    // COPY PART OF ARRAY
    // DOES NOT CHANGE ORIGINAL
    // ====================================================

    let sliceArr = [1,2,3,4,5];

    let sliced = sliceArr.slice(1,4);

    console.log(sliced);

    // [2,3,4]

    console.log(sliceArr);

    // [1,2,3,4,5]


    // ====================================================
    // SPLICE()
    // ADD / DELETE / REPLACE
    // CHANGES ORIGINAL ARRAY
    // ====================================================

    let spliceArr = [1,2,3,4];

    // DELETE

    spliceArr.splice(1,2);

    console.log(spliceArr);

    // [1,4]


    // REPLACE

    let replaceArr = [1,2,3];

    replaceArr.splice(1,1,100);

    console.log(replaceArr);

    // [1,100,3]


    // ADD

    let addArr = [1,2,3];

    addArr.splice(1,0,50);

    console.log(addArr);

    // [1,50,2,3]


    // ====================================================
    // FOREACH()
    // LOOP THROUGH ARRAY
    // ====================================================

    let users = ["Ali","Ahmad","Musab"];

    users.forEach(user=>{
        console.log(user);
    });


    // ====================================================
    // MAP()
    // CREATE NEW ARRAY
    // ====================================================

    let prices = [100,200,300];

    let doubled = prices.map(price=>{
        return price * 2;
    });

    console.log(doubled);

    // [200,400,600]


    // ====================================================
    // FILTER()
    // RETURN MATCHING VALUES
    // ====================================================

    let nums2 = [1,2,3,4,5,6];

    let even = nums2.filter(num=>{
        return num % 2 === 0;
    });

    console.log(even);

    // [2,4,6]


    // ====================================================
    // FIND()
    // RETURN FIRST MATCH
    // ====================================================

    let ages = [10,15,20,25];

    let found = ages.find(age=>{
        return age > 18;
    });

    console.log(found);

    // 20


    // ====================================================
    // SOME()
    // AT LEAST ONE MATCH?
    // ====================================================

    let test1 = [1,2,3];

    console.log(
        test1.some(num=>num>2)
    );

    // true


    // ====================================================
    // EVERY()
    // ALL MATCH?
    // ====================================================

    let test2 = [2,4,6];

    console.log(
        test2.every(num=>num%2===0)
    );

    // true


    // ====================================================
    // REDUCE()
    // REDUCE ARRAY TO SINGLE VALUE
    // ====================================================

    let salary = [1000,2000,3000];

    let total = salary.reduce((acc,current)=>{
        return acc + current;
    },0);

    console.log(total);

    // 6000


    // ====================================================
    // ARRAY DESTRUCTURING
    // ====================================================

    let cities = ["Lahore","Karachi","Islamabad"];

    let [city1, city2, city3] = cities;

    console.log(city1);

    // Lahore


    // ====================================================
    // SPREAD OPERATOR
    // ====================================================

    let first = [1,2];
    let second = [3,4];

    let merged = [...first, ...second];

    console.log(merged);

    // [1,2,3,4]


    // ====================================================
    // REMOVE DUPLICATES
    // ====================================================

    let duplicate = [1,2,2,3,3,4];

    let unique = [...new Set(duplicate)];

    console.log(unique);

    // [1,2,3,4]


    // ====================================================
    // FIND MAXIMUM
    // ====================================================

    let maxArr = [2,3,10,7,8];

    console.log(Math.max(...maxArr));

    // 10


    // ====================================================
    // FIND MINIMUM
    // ====================================================

    console.log(Math.min(...maxArr));

    // 2


    // ====================================================
    // ARRAY INTERVIEW QUESTIONS
    // ====================================================

    // Reverse Array

    let reverseArray = [1,2,3];

    reverseArray.reverse();

    console.log(reverseArray);

    // [3,2,1]


    // Check Value Exists

    console.log(
        reverseArray.includes(2)
    );

    // true


    // Array Length

    console.log(reverseArray.length);

    // 3
</script>
</html>
