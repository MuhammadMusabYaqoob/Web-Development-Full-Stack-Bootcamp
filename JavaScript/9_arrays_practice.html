<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
</body>
<script>
    const orders = [
        { id: 1, customer: "Ali", product: "Laptop", price: 120000, quantity: 1 },
        { id: 2, customer: "Ahmad", product: "Mouse", price: 2500, quantity: 2 },
        { id: 3, customer: "Musab", product: "Keyboard", price: 5000, quantity: 1 },
        { id: 4, customer: "Hamza", product: "Monitor", price: 35000, quantity: 1 },
        { id: 5, customer: "Bilal", product: "Headphones", price: 8000, quantity: 2 },
        { id: 6, customer: "Usman", product: "USB", price: 1200, quantity: 5 },
        { id: 7, customer: "Zain", product: "Printer", price: 25000, quantity: 1 },
        { id: 8, customer: "Sara", product: "Tablet", price: 60000, quantity: 1 },
        { id: 9, customer: "Ayesha", product: "Phone", price: 90000, quantity: 1 },
        { id: 10, customer: "Fatima", product: "Charger", price: 1500, quantity: 3 },
        { id: 11, customer: "Hassan", product: "SSD", price: 12000, quantity: 2 },
        { id: 12, customer: "Maryam", product: "RAM", price: 9000, quantity: 2 },
        { id: 13, customer: "Taha", product: "Camera", price: 75000, quantity: 1 },
        { id: 14, customer: "Iqra", product: "Speaker", price: 6500, quantity: 2 },
        { id: 15, customer: "Anas", product: "Router", price: 7000, quantity: 1 },
        { id: 16, customer: "Umar", product: "Microphone", price: 11000, quantity: 1 },
        { id: 17, customer: "Noor", product: "Power Bank", price: 4500, quantity: 2 },
        { id: 18, customer: "Hira", product: "Smart Watch", price: 18000, quantity: 1 },
        { id: 19, customer: "Kashif", product: "GPU", price: 95000, quantity: 1 },
        { id: 20, customer: "Amna", product: "Webcam", price: 8500, quantity: 1 }
    ];
    console.log(`Before Order Was ${orders.length}`)

    // Q. Add New Order
    // ====================================================
    // push()
    // ====================================================
    orders.push({
        id: 21,
        customer: "Khadia",
        product: "Drier",
        price: 15000,
        quantity: 1
    })
    console.log("\n" + "After Adding New Order length is " + orders.length)



    // Q. Remove order with id = 5. 
    // ====================================================
    // filter() --> return new array with all elements that pass the test
    // ====================================================
    console.log("\n" + "Before Removing Order length is " + orders.length)
    new_orders = orders.filter(order => order.id !== 5);
    console.log("\n" + "After Removing Order with filter() length is " + new_orders.length)
    // Q. Get all orders above 20,000.
    const ordersAbove20000 = orders.filter(order => order.price > 20000)
    console.log("\n" + "All orders above 20,000")
    console.table(ordersAbove20000)
    // Q. Get all orders below 10,000.
    const ordersBelow10000 = orders.filter(order => order.price < 10000)
    console.log("\n" + "All orders below 10,000")
    console.table(ordersBelow10000)
    // Q. Get all customers who purchased only 1 quantity.
    const ordersWith1Quantity = orders
    .filter(order => order.quantity === 1)
    .map(order => ({
        customer: order.customer,
        product: order.product,
        price: order.price
    }))
    console.log("\n" + "All customers who purchased only 1 quantity.")
    console.table(ordersWith1Quantity)
    // Q. Get all products whose price is greater than 50,000.
    const ordersWithPriceGreaterThan50000 = orders.filter((order) => order.price > 50000)
    console.log("\n" + "All products whose price is greater than 50,000.")
    console.table(ordersWithPriceGreaterThan50000)




    // ====================================================
    // ********** with findIndex() and splice()
    // ====================================================
    // findIndex() --> return index
    // splice() --> update the originol array without returning new array
    // ADD / DELETE / REPLACE
    // CHANGES ORIGINAL ARRAY
    // ====================================================
    let index = orders.findIndex(orders => orders.id == 5)
    console.log(`Index of Order with id 5 is ${index}`)
    orders.splice(index, 1) // delete 1 element from index
    console.log(`After Removing Order with findIndex() and splice() length is ${orders.length}`)





    // Q. Update Musab's product from "Keyboard" to "Gaming Keyboard".
    // ====================================================
    // find() --> returns the first item that matches a condition.
    // ====================================================
    for (let i = 0; i < orders.length; i++) {
        if (orders[i].customer == "Musab") {
            console.log(`Before Updating Musab's product his product is ${orders[i].product}`);
        }
    }
    // with forEach
    orders.forEach((value) => {
        if (value.customer == "Musab") {
            console.log(`Before Updating Musab's product his product is ${value.product}`);
        }
    })
    // updating
    orders.forEach((value) => {
        if (value.customer == "Musab") {
            value.product = "Gaming Keyboard"
            musabProduct = value.product
        }
    })
    console.log(`After Updating Musab's product his product is ${musabProduct}`);
    // Q. Find the first order above 50,000.
    let firstOrderAbove50000 = orders.find((order) => order.price > 50000)
    console.log("\n" + "First order above 50,000 is:")
    console.table(firstOrderAbove50000)
    // Q. Find the order whose customer is Sara.
    let saraOrder = orders.find(order => order.customer === "Sara");
    console.log("\n" + "Order whose customer is Sara is:")
    console.table(saraOrder)



    // Q. Print all customer names.
    console.log("\n" + "All Customer Names are:")
    let allCustomerNames = orders.map(value => value.customer)
    console.table(allCustomerNames)



    // Q. Print all product names.
    console.log("\n" + "All Product Names are:")
    orders.forEach((value) => {
        console.log(value.product)
    })


    // Q. Find the order placed by Musab.
    console.log("\n" + "Order placed by Musab is:")
    orders.forEach((value) => {
        if (value.customer == "Musab") {
            console.log(value)
        }
    })
    // with find()
    let musabOrder = orders.find(order => order.customer === "Musab");
    console.log(musabOrder);


    // Q. Check if any customer bought a GPU.
    // ====================================================
    // some() --> check atleast one condition match and return true or false
    // ====================================================
    const hasGPU = orders.some(order => order.product === "GPU");
    // console.log(hasGPU);
    if (hasGPU) {
        console.log("Yes, someone bought a GPU.");
    }
    // with forEach
    orders.forEach((value) => {
        if (value.product == "GPU") {
            console.log("Yes, someone bought a GPU.")
        }
    })
    // Q. Check if any order price is above 100,000.
    hasOrderAbove100000 = orders.some(order => order.price > 100000)
    if (hasOrderAbove100000) {
        console.log("Yes, someone bought a product above 100,000.");
    }else{
        console.log("No, no one bought a product above 100,000.");
    }





    // Q. Check if every order has quantity greater than 0.
    // ====================================================
    // every() --> return true or false for every element
    // ====================================================
    let hasOrderQuantityGreaterThan0 = orders.every(order => order.quantity > 0)
    if (hasOrderQuantityGreaterThan0) {
        console.log("Yes, every order has quantity greater than 0.");
    }else{
        console.log("No, every order has quantity greater than 0.");
    }





    // Q. Find the index of the order with id = 10.
    // ====================================================
    // findIndex() --> return index of object
    // ====================================================
    let order_10 = orders.findIndex(order => order.id === 10);
    console.log(`Index of order 10 is ${order_10}`);
    // with forEach
    orders.forEach((value, index) => {
        if (value.id == 10) {
            console.log(`Index of order 10 with forEach is ${index}`);
        }
    });



    // Q. Create an array containing only customer names.
    // ====================================================
    // map() --> return new array
    // ====================================================
    let customerNames = orders.map(order => order.customer);
    console.log(`All Customer Names are:${customerNames}`);
    // with forEach
    console.log("\n" + "With forEach All Customer Names are:")
    let customerNames2 = [];
    orders.forEach((value) => {
        customerNames2.push(value.customer);
    })
    console.log(customerNames2);
    // Q. Create an array containing only product names.
    let productNames = orders.map(order => order.product);
    console.log(`All Product Names are:${productNames}`);
    // with forEach
    console.log("\n" + "With forEach All Product Names are:")
    let productNames2 = [];
    orders.forEach((value) => {
        productNames2.push(value.product);
    })
    console.log(productNames2);
    // Q. Create a new array containing:
    // {
    //     customer: "Ali",
    //     total: 120000
    // }
    const customerTotals = orders.map(order => {
    return {
        customer: order.customer,
        total: order.quantity * order.price
        };
    });
    console.table(customerTotals);




    // Q. Calculate total revenue.
    // ====================================================
    // reduce() --> return single value
    // ====================================================
    let totalRevenue = orders.reduce((total, order) => {
        return total + order.price * order.quantity
    }, 0)
    console.log(`Total Revenue is ${totalRevenue}`);
    // Q. Calculate total quantity sold.
    let totalQuantity = orders.reduce((total, order) =>{
        return total + order.quantity
    }, 0)
    console.log(`Total Quantity is ${totalQuantity}`);
    // Q. Find the most expensive product.
    const mostExpensiveProduct = orders.reduce((expensive, currentOrder) => {
        if (currentOrder.price > expensive.price) {
            return currentOrder;
        }
        return expensive;
    });
    console.log(`Most Expensive Product is ${mostExpensiveProduct.product} with price ${mostExpensiveProduct.price}`);
    // Q. Find the cheapest product.
    const cheapestProduct = orders.reduce((cheapest, currentOrder) => {
        if (currentOrder.price < cheapest.price) {
            return currentOrder;
        }
        return cheapest;
    });
    console.log(`Cheapest Product is ${cheapestProduct.product} with price ${cheapestProduct.price}`);




    // Q. Sort orders by price (low → high).
    // ====================================================
    // sort() change the originol array and sort that array
    // ====================================================
    let sortbyLowtoHigh = [...orders].sort((a, b) => a.price - b.price)
    console.log("Sort by Low to High")
    console.table(sortbyLowtoHigh)
    // Q. Sort orders by price (high → low).
    let sortbyHightoLow = [...orders].sort((a, b) => b.price - a.price)
    console.log("Sort by High to Low")
    console.table(sortbyHightoLow)
    // Q. Sort customers alphabetically.
    let sortCustomersAlphabetically = [...orders].sort((a, b) => a.customer.localeCompare(b.customer))
    console.log("Sort Customers Alphabetically")
    console.table(sortCustomersAlphabetically)





    // Advance Questions
    // Q. Get the top 5 most expensive products.
    const top5ExpensiveProducts = [...orders].sort((a, b) => b.price - a.price).slice(0, 5)
    console.log("Top 5 Expensive Products")
    console.table(top5ExpensiveProducts)
    // Q. Count how many orders are above 50,000.
    const topOrdersAbove50000 = orders.filter(order => order.price > 50000).length
    console.log(`Total Orders Above 50000 is ${topOrdersAbove50000}`);
    // Q. Create a new array of customer names in uppercase.
    const customerNamesUppercase = orders.map(order => order.customer.toUpperCase());
    console.log("Customer Names in Uppercase:");
    console.table(customerNamesUppercase);
    // Q. Create an array of:
    // {
    // customer: "Ali",
    // orderValue: 120000
    // }
    const customerOrderValues = orders.map(order => ({
        customer: order.customer,
        orderValue: order.price * order.quantity
    }));
    console.log("Customer Order Values:");
    console.table(customerOrderValues); 
</script>
</html>
