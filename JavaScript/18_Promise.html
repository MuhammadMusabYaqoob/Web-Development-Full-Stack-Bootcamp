<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROMISE</title>
</head>
<body>
    <script>
        console.log("=========PROMISE=========")
        // A Promise is an object that represents the eventual completion or failure of an asynchronous operation.
        // A Promise is a proxy for a value not necessarily known when the promise is created.
        // A Promise is a promise that some value will be available later.
        // fetch() is a function provided by the browser to make HTTP requests.

        console.log("**** RESOLVE & THEN")
        var promise = new Promise((resolve) => {
            resolve("Musab");
        });
        promise.then(data => {
            console.log(data);
        });


        console.log("**** WITH DELAY")
        var promise = new Promise((resolve) => {
            setTimeout(() => {
                resolve("Data received");
            }, 3000);

        });
        promise.then(data => {
            console.log(data);
        });





        console.log("**** REJECT & CATCH")
        var promise = new Promise((resolve, reject) => {
            setTimeout(() => {
                reject("Data not received");
            }, 3000);

        });
        promise.catch(error => {
            console.log(error);
        });



        console.log("**** RESOLVE & REJECT")
        var promise = new Promise((resolve, reject) => {
            setTimeout(() => {
                resolve("Data received");
            }, 3000);

        });
        promise.then(data => {
            console.log(data);
        }).catch(error => {
            console.log(error);
        });





        console.log("**** async***************")
        // async is a keyword placed before a function.
        // An async function always returns a Promise.
        async function greet() {
            return "Musab";
        }
        console.log(greet());

        console.log("**** await***************")
        // await means: Wait for a Promise to finish and give me its result.
        // Inside an async function
        var promise = Promise.resolve("Musab");
        console.log("Withot AWAIT", promise);


        async function main() {
        var promise = Promise.resolve("Musab");
        const result = await promise;
        console.log("With AWAIT", result);
    }
    main();

    console.log("********* with .then********")
    var promise = Promise.resolve("Musab");
    promise.then(result => {
        console.log(result);
    });

</script>
</body>
</html>
