<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESTRUCTURING</title>
</head>
<body>
    <script>
        console.log("=========Destructuring")
        // Destructuring is a shortcut way to extract values from an array or object and store them into variables.
        // Destructuring creates new variables and assigns values from an object or array to them.
        // NOT RECREATE VARIABLES OR RENAME
        // ARRAY DESTRUCTURING use brackets []
        // OBJECT DESTRUCTURING use curly braces {}


        console.log("=========Array Destructuring")
        // without destructuring
        colors = ["red", "blue", "green"];
        first = colors[0];
        second = colors[1];
        console.log(first);
        console.log(second);
        // with destructuring
        console.log("***with destructuring")
        var [firstColor, secondColor] = colors;
        console.log(firstColor);
        console.log(secondColor);




        // skip values
        console.log("***skip values")
        fruits = ["Apple", "Banana", "Mango"];
        var [first, , third] = fruits;
        console.log(first);
        console.log(third);




        // rest/spread operator
        console.log("***rest/spread operator")
        nums = [10, 20, 30, 40, 50];
        [first, ...others] = nums;
        console.log(first);
        console.log(others);



        // OBJECT DESTRUCTURING
        console.log("without destructuring")
        user = {
            name: "John",
            age: 30,
            city: "New York"
        };
        name = user.name;
        age = user.age;
        console.log(name);
        console.log(age);

        console.log("with destructuring")
        var {name, age} = user;
        console.log(name);
        console.log(age);

        // renaming variables
        console.log("***renaming variables")
        var {name: userName, age: userAge} = user;
        console.log(userName);
        console.log(userAge);

        // default values
        console.log("***default values")
        var {
            name: userName1, 
            age: userAge1, 
            country = "USA"
        } = user;
        console.log(userName1);
        console.log(userAge1);
        console.log(country);

        var settings = { port: 0, host: null };
        var {
        port: serverPort = 8080,
        host: serverHost = 'localhost',
        secure: isSecure = true
        } = settings;
        console.log(serverPort, serverHost, isSecure);

        // nested destructuring
        console.log("***nested destructuring")
        user = {
            name: "John",
            age: 30,
            address: {
                city: "New York",
                state: "NY"
            }
        };
        var {
            name: userName2,
            age: userAge2,
            address: {city, state}
        } = user;
        console.log(userName2);
        console.log(userAge2);
        console.log(city);
        console.log(state);

    </script>
</body>
</html>
