<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For In Loop</title>
</head>
<body>
    <script>
        // for...in is a JavaScript loop used to iterate over the keys (property names) of an object.

        // get keys
        console.log("======get keys======")
        const obj1 = {
            name: "Ahmad",
            age: 22
        }
        for(let key in obj1){
            console.log(key)
        }
        // get values
        console.log("======get values======")
        for(let key in obj1){
            console.log(obj1[key])
        }

        // get keys and values
         console.log("======get keys and values======")
         for(let key in obj1){
            console.log(key+ " : " + obj1[key])
        }


        console.log("======for in loop with array======")
        const arr1 = ["Ahmad", "Ali", "Musab"]
        for(let index in arr1){
            console.log(index)
        }
        // values
        for(let values in arr1){
            console.log(arr1[values])
        }
        for (let [index, value] of arr1.entries()) {
        // for (let index in arr1) {
        console.log(index + " : " + value)
        }

        // for in vs for of
        // for in return index while for of return values

    </script>
</body>
</html>
