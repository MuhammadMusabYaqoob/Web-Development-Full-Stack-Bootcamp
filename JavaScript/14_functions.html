    // 1. FUNCTION DECLARATION
    function greet() {
        console.log("Hello, World!");
    }
    // 2. FUNCTION CALLING
    greet(); // Output: Hello, World!
    // Hoisted to the top of the scope
    // Can be called before declaration
    console.log("========calling_before_declaration==============")
    calling_before_declaration()

        console.log("Calling before declaration");
    }



    console.log("========FUNCTION WITH PARAMETERS==============")
    // 3. FUNCTION WITH PARAMETERS
    function greetUser(name) {
        if(typeof name === "string"){
            console.log("Hello, " + name + "!");
        }else{
            console.log("Please enter a valid name");
        }
    }
    greetUser("Ali"); // Output: Hello, Musab!




    console.log("========WITH RETURN VALUE==============")
    // 4. FUNCTION WITH RETURN VALUE
    // Parameter is a variable that is used to pass data to a function and it is flexible
    // Aguments are the actual values that are passed to the function during calling
    // Extra arguments are ignored
    function add(a, b) {
        if( typeof a === "number" && typeof b === "number"){
            return a + b;
        }else{
            console.log("Please enter a valid number");
        }
    }
    console.log(add(3, 5)); // Output: 8
    console.log(add(3.5, 5.5)) // Output: 9
    console.log(add(3, 5, 6)); // Output: 8  here 6 will ignore
    console.log(add("3", 5)); // Output: undefined
    console.log(add(3, "5")); // Output: undefined
    console.log(add(3, null)) // Output: undefined
